# wta-daily configuration
#
# Copy this file to config/config.yaml (git-ignored) and adjust as needed.
# Nothing in here should ever be a secret/API key - those are resolved from
# environment variables (see .env.example) via the `*_env` settings below.

# Which tour to track. Only "wta" ships today; adding "atp" is a matter of
# writing new rankings/matches provider plugins and pointing this at them -
# see wta_daily/plugins/rankings and wta_daily/plugins/matches.
tour: wta

# How many players to track (the brief's "Top 10", but flip to 25 any time).
top_n: 10

# How many players to actually *request* in the single rankings API call
# each run - always at least `top_n`. The extra entries (e.g. ranks 11-25
# when top_n is 10) are fetched "for free" in that same one request and
# reused for movement-comparison snapshot history and any future
# featured-player lookups, so a player just outside the tracked Top N never
# needs a dedicated request of her own. Only raise this well beyond top_n if
# you have a concrete near-term need (e.g. planned featured-player range) -
# see README.md's "Understanding API usage" section.
rankings_pool_size: 25

# Where persistent data (rankings history, player cache) and generated
# output live. Both are relative to the current working directory unless
# given as absolute paths.
data_dir: data
output_dir: output
log_dir: logs

# How many days before the run date counts as "the day we're reporting
# match results for" (1 = yesterday, UTC calendar day). A player with no
# CONFIRMED completed match on this exact date is reported as
# `played: false` in report.json - the pipeline never substitutes an older
# match. See README.md's "Match-data reliability" section for why this
# replaced a per-player "latest known match regardless of date" approach.
match_target_date_offset_days: 1

# --- Data providers -----------------------------------------------------
# `provider` selects a registered plugin by name (see
# wta_daily/plugins/registry.py). Everything else in each block is passed
# straight through to that plugin's constructor.

rankings_provider:
  provider: wta_official
  # base_url: https://api.wtatennis.com/tennis
  # ranking_type: rankSingles
  # metric: singles

match_provider:
  # `best_of` asks every source below "did each of these players complete a
  # match on this exact date", trying sources in order and isolating
  # failures per source (one source erroring never blocks another) - the
  # first source to confirm a player's match wins; a player not found by any
  # source is reported as `played: false`. This is the recommended default:
  # `wta_official`'s per-player history (used by get_latest_match) can lag
  # real-world results by over a week during a live event, but its
  # tournament-level day-first lookup (get_matches_for_date) is near-real-time
  # - confirmed live against the WTA's own site, which is built on the same
  # backend. `live_tennis_api` (paid) is a good second source but has its own
  # per-player coverage gaps (verified live - see README.md's "Match-data
  # reliability" section).
  provider: best_of
  sources:
    - provider: wta_official
      # lookback_matches: 25
      # catalogue_scan_pages: 25   # how many ~100-entry pages of the tournament catalogue to scan for "active this week"
    - provider: live_tennis_api
      # lookback_matches: 20
      # api_key_env: LIVETENNISAPI_KEY   # resolved from the environment/.env - never put the key here
  #
  # A third paid source (api_tennis, api-tennis.com) is also implemented and
  # available, but not included above by default: live testing found ~4 of
  # 10 players' match dates one calendar day later than the same matches'
  # dates confirmed via the two sources above. Because get_matches_for_date
  # only accepts a source's result when its date exactly matches the target
  # day, this drift mostly makes api_tennis silently miss those matches
  # rather than report a wrong one - safer than it would have been under the
  # old "prefer the most recent date across sources" logic, but still not
  # a source worth defaulting to. Its rankings data and overall match
  # coverage were otherwise excellent (in fact more complete than
  # live_tennis_api for one player); see the README's "Match-data
  # reliability" section for the full comparison. Add it if you want maximum
  # redundancy, or as a replacement for live_tennis_api if you don't have a
  # livetennisapi.com key:
  #   - provider: api_tennis
  #     # lookback_days: 45
  #     # api_key_env: APITENNIS_KEY
  #
  # To use only the free official source (no API key needed, no paid
  # dependency), replace the whole block above with:
  #   match_provider:
  #     provider: wta_official
  #
  # To use only one paid source:
  #   match_provider:
  #     provider: live_tennis_api
  #     api_key_env: LIVETENNISAPI_KEY

# --- Featured player (recurring editorial segment, disabled by default) ----
# A short, playful, recurring spotlight on one specific player, layered on
# top of - never mixed into - the factual Top N coverage above. Every fact
# reported for her (rank, points, movement, match result) still comes from
# the exact same rankings_provider/match_provider configured above; this
# block only says *who* and *which narration personality* (`tagline`) to
# use for the commentary. See README.md's "Featured player" section for
# the full tone guidelines and wta_daily/scripts_gen/featured_player_phrases.py
# for the "america_favorite" wording this ships with (tuned for Emma
# Navarro, WTA player id 325410, but not Emma-specific by name - a future
# featured player could reuse the same tagline, or a different one).
# Enabling this also automatically renders a dedicated "Featured Player"
# spotlight graphic (output/<date>/featured_player.png -
# wta_daily/graphics/featured_card.py) and, when video is enabled, shows it
# during her narration segment in the synchronized video - no separate
# toggle needed for either.
featured_player:
  enabled: false
  player_id: "325410"  # Emma Navarro's real api.wtatennis.com player id
  name: Emma Navarro
  tagline: america_favorite

# --- Networking (used by every HTTP-based provider) ----------------------
network:
  timeout_seconds: 15
  max_retries: 3
  backoff_factor: 1.5
  user_agent: "wta-daily/0.1 (+https://github.com/your-org/wta-daily)"

# --- Narration script -----------------------------------------------------
script:
  # "template" (default, offline, free) or "openai" (needs OPENAI_API_KEY).
  generator: template
  target_minutes_low: 5
  target_minutes_high: 8
  words_per_minute: 150
  openai_model: gpt-4o-mini
  openai_api_key_env: OPENAI_API_KEY

# --- Graphics ---------------------------------------------------------------
graphics:
  renderer: pillow
  width: 1920
  height: 1080
  theme:
    background_color: "#0B0F19"
    panel_color: "#141B2D"
    accent_color: "#00E0C6"
    text_color: "#F5F7FA"
    subtext_color: "#9AA5B1"
    up_color: "#2ECC71"
    down_color: "#E74C3C"
    same_color: "#9AA5B1"
    # font_bold: assets/fonts/YourFont-Bold.ttf
    # font_regular: assets/fonts/YourFont-Regular.ttf

# --- Voice synthesis (Phase 2, disabled by default) ------------------------
voice:
  enabled: false
  provider: elevenlabs
  voice_id: "21m00Tcm4TlvDq8ikWAM"
  model_id: "eleven_multilingual_v2"
  stability: 0.5
  similarity_boost: 0.75
  api_key_env: ELEVENLABS_API_KEY

# --- Video assembly (Phase 2, disabled by default) -------------------------
video:
  enabled: false
  assembler: ffmpeg
  width: 1920
  height: 1080
  fps: 30
  seconds_per_player_card: 6
  # background_music_path: assets/music/theme.mp3

# --- Git automation (Phase 2, disabled by default) -------------------------
git:
  auto_commit: false
  auto_push: false
  remote: origin
  # branch: main
  commit_message_template: "Daily WTA Update {date}"

# --- YouTube publishing assets (on by default) ------------------------------
# thumbnail.png (1280x720) and youtube_description.txt - built entirely from
# the same report data already fetched this run, so there's no extra API
# cost to generating either. Each can be turned off independently if you
# don't want one of them; there's no reason to disable both other than
# saving a fraction of a second of rendering time.
publishing:
  thumbnail_enabled: true
  description_enabled: true

# --- Tournament preferences --------------------------------------------------
# Used by future modules (e.g. tournament previews) to prioritize which
# events get extra narration attention.
tournament_preferences:
  - Grand Slam
  - WTA 1000
