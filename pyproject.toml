[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wta-daily"
version = "0.1.0"
description = "Automated daily WTA Top N ranking video asset generator, built as a plugin-based Python package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "Pillow>=10.0",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "mypy>=1.10,<2",
    "ruff>=0.5,<1",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
wta-daily = "wta_daily.cli:main"

[tool.setuptools.packages.find]
include = ["wta_daily*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
